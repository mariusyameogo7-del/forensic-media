services:
  # 1. FastAPI Backend API (Render Frankfurt)
  - type: web
    name: forensic-media-api
    env: docker
    region: fra
    plan: free
    dockerfilePath: infra/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_STR
        value: /api/v1
      - key: DATABASE_URL
        value: postgresql+psycopg://postgres.qabyrfzkrbqxldfybnid:Q9%2BR%25v3b2ny.Wt.@aws-1-eu-west-1.pooler.supabase.com:6543/postgres
      - key: SUPABASE_URL
        value: https://qabyrfzkrbqxldfybnid.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: sb_secret_KUH_xLu9b5Vmekq86_Sd6g_jpCQVA6o
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_2t8bdDFBnJ-WKA1mM7-jbQ_r65ElgnA
      - key: SUPABASE_JWT_SECRET
        value: 0pfEAX3o00mbgNw+etAA5uPOrl7GOuwlk+p9UopYOswv8Hw/krMgXtKPzx2set9n/RxuKdr5oQ7oB0aF0iIi0Q==
      - key: STORAGE_BUCKET_ORIGINALS
        value: media-originals
      - key: STORAGE_BUCKET_PREVIEWS
        value: media-previews
      - key: STORAGE_BUCKET_REPORTS
        value: analysis-reports

  # 2. Next.js / Web Application (Render Frankfurt)
  - type: web
    name: forensic-media-web
    env: node
    region: fra
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://qabyrfzkrbqxldfybnid.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_2t8bdDFBnJ-WKA1mM7-jbQ_r65ElgnA
