name: CI Pipeline - Forensic Media

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: forensic_media_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y exiftool libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -r workers/analysis/requirements.txt

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/forensic_media_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          python tests/run_all_tests.py

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://forensic-media-api-staging.onrender.com
        run: npm run build
